<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#171329"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#67e8f9"/>
  </marker>
  <style>
    .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
    .sub{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
    .label{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
    .desc{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
    .tag{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#67e8f9;letter-spacing:1px}
    .arrowtxt{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#a5f3fc}
  </style>
</defs>
<rect width="1400" height="520" rx="26" fill="url(#bg)"/>
<text x="700" y="62" text-anchor="middle" class="title">Syntrix — System Architecture</text>
<text x="700" y="91" text-anchor="middle" class="sub">A local inference pipeline from the browser interface to the Qwen model</text>

<!-- Nodes -->
<g filter="url(#shadow)">
  <rect x="55" y="170" width="250" height="190" rx="20" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="55" y="170" width="250" height="8" rx="4" fill="url(#accent)"/>
  <rect x="345" y="170" width="250" height="190" rx="20" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="345" y="170" width="250" height="8" rx="4" fill="url(#accent)"/>
  <rect x="635" y="170" width="250" height="190" rx="20" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="635" y="170" width="250" height="8" rx="4" fill="url(#accent)"/>
  <rect x="925" y="170" width="250" height="190" rx="20" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="925" y="170" width="250" height="8" rx="4" fill="url(#accent)"/>
  <rect x="1210" y="170" width="145" height="190" rx="20" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="1210" y="170" width="145" height="8" rx="4" fill="url(#accent)"/>
</g>

<!-- Node text -->
<text x="180" y="220" text-anchor="middle" class="tag">CLIENT</text>
<text x="180" y="260" text-anchor="middle" class="label">React + Vite</text>
<text x="180" y="295" text-anchor="middle" class="desc">Prompt and controls</text>
<text x="180" y="320" text-anchor="middle" class="desc">Results and history</text>

<text x="470" y="220" text-anchor="middle" class="tag">API LAYER</text>
<text x="470" y="260" text-anchor="middle" class="label">FastAPI</text>
<text x="470" y="295" text-anchor="middle" class="desc">POST /generate</text>
<text x="470" y="320" text-anchor="middle" class="desc">Request validation</text>

<text x="760" y="220" text-anchor="middle" class="tag">SERVICE LAYER</text>
<text x="760" y="260" text-anchor="middle" class="label">Ollama Client</text>
<text x="760" y="295" text-anchor="middle" class="desc">Builds model request</text>
<text x="760" y="320" text-anchor="middle" class="desc">Passes generation options</text>

<text x="1050" y="220" text-anchor="middle" class="tag">LOCAL INFERENCE</text>
<text x="1050" y="260" text-anchor="middle" class="label">Ollama Runtime</text>
<text x="1050" y="295" text-anchor="middle" class="desc">Runs on local machine</text>
<text x="1050" y="320" text-anchor="middle" class="desc">Returns generated text</text>

<text x="1282" y="220" text-anchor="middle" class="tag">MODEL</text>
<text x="1282" y="260" text-anchor="middle" class="label" style="font-size:18px">Qwen 3.5</text>
<text x="1282" y="295" text-anchor="middle" class="desc">9B</text>
<text x="1282" y="320" text-anchor="middle" class="desc">Local model</text>

<!-- Connectors -->
<path d="M305 265 H337" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M595 265 H627" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M885 265 H917" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1175 265 H1202" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

<text x="320" y="245" text-anchor="middle" class="arrowtxt">HTTP</text>
<text x="610" y="245" text-anchor="middle" class="arrowtxt">Call</text>
<text x="900" y="245" text-anchor="middle" class="arrowtxt">Local API</text>
<text x="1188" y="245" text-anchor="middle" class="arrowtxt">Infer</text>

<text x="700" y="425" text-anchor="middle" class="sub">Response returns through the same path: model → Ollama → FastAPI → React UI</text>
<rect x="490" y="450" width="420" height="34" rx="17" fill="#0f3441" stroke="#155e75"/>
<text x="700" y="472" text-anchor="middle" class="tag">LOCAL-FIRST · NO HOSTED AI API REQUIRED</text>
</svg>